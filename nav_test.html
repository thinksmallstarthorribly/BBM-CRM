<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;display:flex;height:100vh;overflow:hidden}
.sb{width:200px;background:#f0f0f0;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%);transition:transform .25s}
.sb.open{transform:translateX(0)}
.nav{padding:8px 0;overflow-y:auto}
button.ni{display:block;width:100%;text-align:left;padding:12px 16px;background:none;border:none;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
button.ni.on{background:#3EC6F0;color:white}
.main{flex:1;margin-left:0}
.topbar{padding:12px;background:#1AA8D4;color:white;display:flex;align-items:center;gap:12px}
.ham{background:none;border:2px solid white;color:white;padding:6px 10px;font-size:18px;cursor:pointer;touch-action:manipulation}
.view{display:none;padding:20px;height:calc(100vh - 48px);overflow-y:auto}
.view.on{display:block}
#ttl{font-size:18px;font-weight:bold}
</style>
</head>
<body>

<div class="sb" id="sidebar">
  <div class="nav">
    <button class="ni on" id="ni-home" type="button" onclick="go('home')">⚡ Command Centre</button>
    <button class="ni" id="ni-cal" type="button" onclick="go('cal')">📅 Calendar</button>
    <button class="ni" id="ni-leads" type="button" onclick="go('leads')">🎯 All Leads</button>
    <button class="ni" id="ni-templates" type="button" onclick="go('templates')">✉️ Templates</button>
  </div>
</div>

<div class="sb-overlay" id="sbOverlay" onclick="toggleSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>

<div class="main">
  <header class="topbar">
    <button class="ham" onclick="toggleSidebar()">☰</button>
    <div id="ttl">Command Centre</div>
  </header>

  <div class="view on" id="v-home"><h2>HOME VIEW</h2><p>This is the command centre.</p></div>
  <div class="view" id="v-cal"><h2>CALENDAR VIEW</h2><p>Calendar is working.</p></div>
  <div class="view" id="v-leads"><h2>LEADS VIEW</h2><p>All leads here.</p></div>
  <div class="view" id="v-templates"><h2>TEMPLATES VIEW</h2><p>Email templates here.</p></div>
</div>

<script>
var titles={home:'Command Centre',cal:'Calendar',leads:'All Leads',templates:'Templates'};

function go(v){
  document.querySelectorAll('.view').forEach(function(el){el.classList.remove('on');});
  document.querySelectorAll('.ni').forEach(function(el){el.classList.remove('on');});
  var ve=document.getElementById('v-'+v);
  if(ve)ve.classList.add('on');
  var ne=document.getElementById('ni-'+v);
  if(ne)ne.classList.add('on');
  document.getElementById('ttl').textContent=titles[v]||v;
  // close sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sbOverlay').style.display='none';
}

function toggleSidebar(){
  var sb=document.getElementById('sidebar');
  var ov=document.getElementById('sbOverlay');
  var isOpen=sb.classList.toggle('open');
  ov.style.display=isOpen?'block':'none';
}
</script>
</body>
</html>
