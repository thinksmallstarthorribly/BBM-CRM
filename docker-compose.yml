services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bbm
      POSTGRES_PASSWORD: bbm
      POSTGRES_DB: bbm_crm
    volumes:
      - bbm_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbm -d bbm_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://bbm:bbm@postgres:5432/bbm_crm
    ports:
      - "3000:3000"

volumes:
  bbm_pg_data:
